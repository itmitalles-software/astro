# Paste and links for programs running over SSH, also in full-screen TUIs that
# own the mouse. Standalone, so a kitty without the Astro theme can include it
# together with astro_clipboard.py and astro_remote.py.
# SPDX-License-Identifier: GPL-3.0-or-later

# Right click: clipboard screenshot as a file path (otherwise clipboard text).
# Middle click: selected text, even in mouse-aware agent TUIs.
mouse_map right release grabbed,ungrabbed kitten astro_clipboard.py
mouse_map middle release grabbed,ungrabbed paste_from_selection

# Inside an ssh client: open clicked links on this machine and upload a pasted
# screenshot. Everywhere else these stay a plain click and the plain keys.
mouse_map left click grabbed kitten astro_remote.py open-link
map ctrl+v kitten astro_remote.py ctrl+v
map ctrl+shift+v kitten astro_remote.py ctrl+shift+v
